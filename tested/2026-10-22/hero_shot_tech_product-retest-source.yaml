authors:
- name: WenceStudio by SmartDesign
  github: Wence412
apae:
  appearance: slim matte black wireless earbuds in their charging case, soft-touch finish, no visible
    branding
  place: dark obsidian surface, deep shadow background, single beam spotlight from upper right
  action: case open at 45 degrees, one earbud resting beside it, angled composition, rule of thirds; One
    earbud seated, one outside; lid halfway between closed and vertical, 45 degrees to horizontal tray
  emotion: precision, quiet confidence, premium audio, focused
chatgpt_image_2:
  prompt: 'Slim matte black wireless earbuds in their open charging case, soft-touch finish, no visible
    branding. One earbud resting beside the case on a dark obsidian surface. Case angled open at 45 degrees.
    Composition following rule of thirds. Single beam spotlight from upper right cutting through deep
    shadow background. Premium tech product photography. Sharp focus on both the case hinge and the earbud
    driver. Deep blacks. Minimal reflection. Cinematic mood. No clutter. Exactly two earbuds in total:
    one seated in the case and one resting beside it. Show a side three-quarter camera view that makes
    the hinge angle readable. The lid is raised halfway between fully closed and vertical, forming an
    approximately 45-degree angle with the horizontal case tray. Do not open the lid vertically or beyond
    45 degrees.

    '
  style_preset: product_photo
  background: cinematic
  ar: '16:9'
  quality: hd
engine_overrides:
  midjourney:
    prompt: 'Matte black wireless earbuds open case obsidian surface, single spotlight upper right, one
      earbud beside, rule of thirds, premium tech product photography, cinematic deep shadow --ar 16:9
      --style raw --v 6 --q 2 Exactly two earbuds in total: one seated in the case and one resting beside
      it. Show a side three-quarter camera view that makes the hinge angle readable. The lid is raised
      halfway between fully closed and vertical, forming an approximately 45-degree angle with the horizontal
      case tray. Do not open the lid vertically or beyond 45 degrees.

      '
    flags: --ar 16:9 --style raw --v 6 --q 2
  dalle3:
    prompt: 'Premium matte black wireless earbuds in an open charging case on a dark obsidian surface.
      One earbud rests beside the case. Case is open at 45 degrees. Single beam spotlight from upper right.
      Deep shadows. Cinematic product photography. Sharp detail on hinge and driver. No logos, text, or
      branding visible. Exactly two earbuds in total: one seated in the case and one resting beside it.
      Show a side three-quarter camera view that makes the hinge angle readable. The lid is raised halfway
      between fully closed and vertical, forming an approximately 45-degree angle with the horizontal
      case tray. Do not open the lid vertically or beyond 45 degrees.

      '
negatives:
- logos
- text
- brand names
- watermark
- bright colors
- cable visible
- blurry
- overexposed highlights
- messy composition
