title: Titanium Smartwatch — Dark Concrete Studio — Premium
version: 1.0.1
category: products
engine_primary: chatgpt_image_2
tags:
- luxury
- smartwatch
- wearable
- minimal
- dark
authors:
- name: WenceStudio by SmartDesign
  github: Wence412
apae:
  appearance: titanium smartwatch, matte charcoal case, sapphire glass face, brushed steel band with deployant
    clasp
  place: dark concrete studio with a single overhead spotlight, smoke-effect background haze
  action: floating at 30-degree angle, slight clockwise rotation, band curving naturally downward; Open
    deployant clasp with separated ends; bracelet hangs downward in an open U curve
  emotion: premium, precise, futuristic, confident
chatgpt_image_2:
  prompt: 'Titanium smartwatch with matte charcoal case, sapphire glass face, and brushed steel band with
    deployant clasp. Floating at a 30-degree angle with slight clockwise rotation, band curving naturally
    downward. Dark concrete studio setting with a single overhead spotlight casting a sharp pool of light,
    smoke-effect background haze creating depth. Premium product photography. Dramatic shadows. High-contrast
    lighting. Razor-sharp focus on the watch face. Editorial quality. No reflection obscuring the face.
    Deep black background fading into smoke. The deployant clasp is visibly OPEN beneath the floating
    watch. The articulated bracelet hangs in an open U-shaped curve under gravity, with separated clasp
    ends clearly visible. It must not form a closed oval loop. Keep the watch face blank with a controlled,
    subtle edge highlight rather than a reflection covering the face.

    '
  style_preset: product_photo
  background: cinematic
  ar: '1:1'
  quality: hd
engine_overrides:
  midjourney:
    prompt: 'Titanium smartwatch matte charcoal case sapphire glass floating at 30-degree angle, dark
      concrete studio overhead spotlight smoke haze, premium product photography, dramatic shadows high
      contrast, editorial quality --ar 1:1 --style raw --v 6 --q 2 The deployant clasp is visibly OPEN
      beneath the floating watch. The articulated bracelet hangs in an open U-shaped curve under gravity,
      with separated clasp ends clearly visible. It must not form a closed oval loop. Keep the watch face
      blank with a controlled, subtle edge highlight rather than a reflection covering the face.

      '
    flags: --ar 1:1 --style raw --v 6 --q 2
  dalle3:
    prompt: 'A premium titanium smartwatch with a matte charcoal case and sapphire glass face, floating
      at a 30-degree angle inside a dark concrete studio. A single overhead spotlight illuminates the
      watch face with dramatic precision. Deep shadows. Smoke-effect background. Product photography quality.
      Sharp focus. No text or logos visible. The deployant clasp is visibly OPEN beneath the floating
      watch. The articulated bracelet hangs in an open U-shaped curve under gravity, with separated clasp
      ends clearly visible. It must not form a closed oval loop. Keep the watch face blank with a controlled,
      subtle edge highlight rather than a reflection covering the face.

      '
negatives:
- logos
- text
- watermark
- fingerprints
- reflections on glass
- hands
- people
- blurry
